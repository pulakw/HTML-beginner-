<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action ="/matter">
        <label for="namee"></label>
        username: <input type="text" id="namee" required ="true"> 
        <br>
        password: <input type="password"><br>
        date: <input type="date"><br>
        file: <input type="file"><br>
        color:<input type="color"><br>
        range:<input type="range"><br>
        poke me: <input type="button" value="poke"><br>
        submit:<input type="submit"><br>

        <label for="m">male:</label>
        <input type="radio" id="m" name="gender" value="male"><br>
        <label for="f">female:</label>
        <input type="radio" id="f" name="gender" value="female"><br>
        <label for="o">other:</label>
        <input type="radio" id="o" name="gender" value="other"><br>


        <label for="c">C</label>
        <input type="checkbox" id="c" name="lang" value="C"><br>
        <label for="j">JAVA</label>
        <input type="checkbox" id="j" name="lang" value="Java"><br>
        <label for="c++">C++</label>
        <input type="radio" id="c++" name="lang" value="C++"><br>
        
        <label for="country"> select your country</label>
        <select name="country" id="country">
            <option value="india">India</option>
            <option value="US">US</option>
            <option value="UK">UK</option>
            <option value="other">other</option>
        </select>
        <textarea name="story" id="story" cols="30" rows="10">
            please write
        </textarea>

    </form>
</body>
</html>
